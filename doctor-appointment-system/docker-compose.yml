services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: SQL_Database_edoc
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdevpassword}
    depends_on:
      - db

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdevpassword}
      MYSQL_DATABASE: SQL_Database_edoc
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - "3306"

volumes:
  db_data:
