# Local stand-in for the Render-shaped stack: PHP + Feature 01 + Feature 02.
# Feature 03 is intentionally absent. Do not point this file at Aiven/production.
# Uses the isolated Demo database (SQL_Database_edoc_demo) for local checks only.
#
# Do not run this at the same time as docker-compose.demo.yml on the same ports.
# Demo (with F03): docker compose -f docker-compose.demo.yml up -d
# Public shape:    docker compose -f docker-compose.public-ai.yml up -d --build
#
# PHP must not receive NOSHOW_URL / NOSHOW_TOKEN.

services:
  public-web:
    build:
      context: .
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:8080"
    volumes:
      - ./doctor-appointment-system:/var/www/html
    environment:
      PORT: "8080"
      DB_HOST: demo-db
      DB_PORT: "3306"
      DB_NAME: SQL_Database_edoc_demo
      DB_USER: edoc_demo
      DB_PASSWORD: ${DEMO_DB_PASSWORD:-localdemopassword}
      DB_SSL: "false"
      SESSION_COOKIE_SECURE: "0"
      AI_SERVICE_URL: http://edoc-specialty:8081
      AI_SERVICE_TIMEOUT: "8"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-token}
      ASSISTANT_URL: http://edoc-assistant:8082
      ASSISTANT_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-local-assistant-token}
    depends_on:
      demo-db:
        condition: service_healthy
      edoc-assistant:
        condition: service_started
      edoc-specialty:
        condition: service_started

  edoc-specialty:
    build:
      context: ./AI/feature01_specialty
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-token}

  edoc-assistant:
    build:
      context: ./AI/feature02_assistant
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      ASSISTANT_SERVICE_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-local-assistant-token}

  demo-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-localdemoroot}
      MYSQL_DATABASE: SQL_Database_edoc_demo
      MYSQL_USER: edoc_demo
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-localdemopassword}
    ports:
      - "3308:3306"
    volumes:
      - edoc_demo_db_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocaldemoroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  edoc_demo_db_data:
    external: true
    name: project_raghad_abeed_edoc_demo_db_data
