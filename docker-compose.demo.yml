# Isolated Demo stack only. Does not use Aiven or production credentials.
# Port 3308 avoids the local production-compose DB on 3307.
# Port 8088 is the Demo PHP app; production local compose stays on 8080.

services:
  demo-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edoc-demo-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:8080"
    volumes:
      - ./doctor-appointment-system:/var/www/html
    environment:
      PORT: "8080"
      DB_HOST: demo-db
      DB_PORT: "3306"
      DB_NAME: SQL_Database_edoc_demo
      DB_USER: edoc_demo
      DB_PASSWORD: ${DEMO_DB_PASSWORD:-localdemopassword}
      DB_SSL: "false"
      SESSION_COOKIE_SECURE: "0"
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://edoc-specialty:8081}
      AI_SERVICE_TIMEOUT: "8"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-token}
      ASSISTANT_URL: ${ASSISTANT_URL:-http://edoc-assistant:8082}
      ASSISTANT_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-local-assistant-token}
      NOSHOW_URL: ${NOSHOW_URL:-http://edoc-noshow:8083}
      NOSHOW_TOKEN: ${NOSHOW_SERVICE_TOKEN:-local-noshow-token}
    depends_on:
      demo-db:
        condition: service_healthy
      edoc-assistant:
        condition: service_started
      edoc-specialty:
        condition: service_started
      edoc-noshow:
        condition: service_started

  edoc-specialty:
    build:
      context: ./AI/feature01_specialty
    container_name: edoc-specialty
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-dev-token}

  edoc-assistant:
    build:
      context: ./AI/feature02_assistant
    container_name: edoc-assistant
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      ASSISTANT_SERVICE_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-local-assistant-token}

  edoc-noshow:
    build:
      context: ./AI/feature03_noshow
    container_name: edoc-noshow
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      NOSHOW_SERVICE_TOKEN: ${NOSHOW_SERVICE_TOKEN:-local-noshow-token}
      NOSHOW_BUNDLE_DIR: /app/model_bundle

  demo-db:
    image: mariadb:10.11
    container_name: edoc-demo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-localdemoroot}
      MYSQL_DATABASE: SQL_Database_edoc_demo
      MYSQL_USER: edoc_demo
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-localdemopassword}
    ports:
      - "3308:3306"
    volumes:
      - edoc_demo_db_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocaldemoroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  edoc_demo_db_data:
